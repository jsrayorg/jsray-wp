name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A branch only needs its newest commit checked.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # tools/hooks/commit-msg only protects a machine that has run
  # `git config core.hooksPath tools/hooks`. Nothing protected the pull request
  # itself, which is how `Release 0.0.2-beta.2` reached Core's main and printed
  # itself beside a dozen files — permanently, since a merged subject cannot be
  # reworded once a tag points at it. Same file, run where it cannot be skipped.
  subjects:
    name: Commit subjects
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          # Every commit the pull request adds, not just its tip.
          fetch-depth: 0
      - name: Check each subject against tools/hooks/commit-msg
        run: |
          set -e
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          failed=0
          for sha in $(git rev-list --no-merges "$base..$head"); do
            git log -1 --format=%B "$sha" > /tmp/msg
            if ! sh tools/hooks/commit-msg /tmp/msg; then
              echo "  ^ $(git log -1 --format='%h %s' "$sha")"
              failed=1
            fi
          done
          [ "$failed" = "0" ] || exit 1

  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    # This repository bundles a copy of the JSRay rendering engine, and an
    # engine that hangs is a failure mode the ecosystem has actually shipped:
    # before Core 0.0.1-beta.3 an unterminated string could hold it for
    # minutes. Without a limit that becomes a six-hour runner and the signal
    # arrives as a billing surprise rather than a red check.
    timeout-minutes: 10
    strategy:
      # One Node version failing should not hide whether the others pass.
      fail-fast: false
      matrix:
        # In step with package.json engines.node. 18 left when it went
        # end-of-life; nothing here needed it to stay.
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Validate version metadata
        run: npm run check:versions
      # The bundled Core is a copy and does not update itself. The drift check
      # above compares against a sibling checkout and skips when Core is absent,
      # which is every run here — so without this a stale engine passes CI.
      - name: Bundled Core is the published Core
        run: npm run check:core
      - name: Run tests
        run: npm test
      # `npm run build` gates on a fresh Core (`--strict`), which is the right
      # rule for shipping a zip and the wrong one for every commit: an
      # integration syncs Core as part of its own release, so being behind
      # between releases is the expected state and must not turn CI red. The
      # packaging script is called directly here, because what this step needs
      # to prove is that the zip still builds. This repository was the only one
      # of the three wiring the packaging gate into ordinary CI, and it went
      # unnoticed because the last push predated Core moving ahead.
      - name: Build plugin zip
        run: sh tools/build-plugin.sh

  php-lint:
    name: PHP syntax (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: Lint all PHP files
        run: |
          set -e
          find . -name '*.php' -not -path './build/*' -print0 | xargs -0 -n1 php -l
